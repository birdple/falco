global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # falco. /metrics is only mounted behind the API key, so the scrape carries
  # it. This is the development key from docker-compose.yml; for any other
  # deployment use credentials_file instead of an inline value.
  - job_name: 'falco'
    static_configs:
      - targets: ['falco-service:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scheme: http
    authorization:
      type: Bearer
      credentials: falco-dev-api-key-not-for-production
