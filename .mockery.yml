# The mocks in tests/mocks/ come from here: `make mocks` (go tool mockery,
# pinned as a tool in go.mod). They are never edited by hand; `make mocks-check`
# (part of `make check` and CI) fails when they drift from the interfaces.
#
# pkgname is required: without it mockery v3 names the package after the source
# interface's (processor, storage) and leaves two different packages in one
# directory, which does not compile.
all: false
pkgname: mocks
packages:
  github.com/birdple/falco/internal/storage:
    config:
      filename: "mock_{{.InterfaceName}}.go"
      dir: "tests/mocks"
    interfaces:
      StorageBackend:
  github.com/birdple/falco/internal/processor:
    config:
      filename: "mock_{{.InterfaceName}}.go"
      dir: "tests/mocks"
    interfaces:
      Cache:
      ImageProcessor:
