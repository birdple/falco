# Los mocks de tests/mocks/ salen de aquí: `go run github.com/vektra/mockery/v3`.
# No se editan a mano.
#
# pkgname es obligatorio: sin él mockery v3 nombra el paquete como el de la
# interfaz de origen (processor, storage) y deja dos paquetes distintos en el
# mismo directorio, que no compila.
all: false
pkgname: mocks
packages:
  github.com/birdple/falco/internal/storage:
    config:
      filename: "mock_{{.InterfaceName}}.go"
      dir: "tests/mocks"
    interfaces:
      StorageBackend:
  github.com/birdple/falco/internal/processor:
    config:
      filename: "mock_{{.InterfaceName}}.go"
      dir: "tests/mocks"
    interfaces:
      Cache:
      ImageProcessor:
