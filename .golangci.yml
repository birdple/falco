# golangci-lint configuration for falco.
#
# The default linters (errcheck, govet, ineffassign, staticcheck, unused) amount
# to "it compiles and nothing is unused". The ones added here cover two more
# things: the bug classes this service can pay dearly for, and readability —
# which is what was cleaned up in August 2026 and what this gate exists to keep.
#
# Run with `make check` (or `make lint-linux` for CI's exact result).
#
# Considered and left out after a trial run: gosec, contextcheck, nilerr and
# forcetypeassert. Their findings here were deliberate (MD5 for directory
# sharding, singleflight work on a background context, a page that renders an
# error instead of failing) and would only have bred //nolint comments.
version: "2"

linters:
  # misspell runs here: falco is a public project and its comments are in
  # English, so the linter's dictionary genuinely applies.
  enable:
    - bodyclose      # an unclosed response body leaks the connection
    - errorlint      # == and type assertions on wrapped errors fail silently
    - copyloopvar    # loop-variable copies that are no longer needed
    - nolintlint     # no bare //nolint: silencing something needs a reason
    - perfsprint
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace
    - misspell

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: waitgroup-by-value
        # Readability rules added in the 2026-08 cleanup:
        - name: exported            # every exported symbol has a godoc
        - name: var-naming
        - name: confusing-naming    # two names that differ only in case
        - name: flag-parameter      # booleans that branch behaviour
        - name: bare-return
        - name: package-comments

  exclusions:
    rules:
      # Tests get looser patterns: what they check is often the exact error
      # value, and a test helper needs no godoc.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - errorlint
          - revive

      # GENERATED code is never edited by hand, so demanding style from it only
      # produces noise nobody can fix.
      - path: (_templ\.go|mock_.*\.go)
        linters:
          - revive
          - errcheck
          - errorlint
          - perfsprint
          - unconvert
          - wastedassign
          - whitespace

      # Names that "stutter" (storage.StorageConfig, cache.CacheStats) are NOT
      # renamed: changing them for style would churn every caller for a nicer
      # name and nothing else.
      - path: (internal/storage/interfaces\.go|internal/cache/lru\.go|internal/pkg/circuitbreaker/storage\.go)
        text: "stutters"
        linters:
          - revive

formatters:
  enable:
    - gofmt
