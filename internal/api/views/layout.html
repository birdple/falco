{{define "layout"}}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagine | Dashboard</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <script src="/static/js/htmx.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="h-screen flex flex-col font-sans selection:bg-indigo-500/30 overflow-hidden bg-slate-950">
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-2xl font-bold shadow-lg shadow-indigo-500/20">
                i
            </div>
            <h1 class="text-xl font-bold tracking-tight">falco</h1>
        </div>
        <div class="flex items-center gap-6">
            <a href="/" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Dashboard</a>
            <a href="#" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Documentation</a>
            <button
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all hover:scale-[1.02] active:scale-95 shadow-lg shadow-indigo-500/25">
                Upload New
            </button>
        </div>
    </nav>

    <main class="flex-1 flex overflow-hidden relative">
        {{block "content" .}}{{end}}
    </main>

    <!-- Global Lightbox -->
    <div id="lightbox"
        class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-950/95 backdrop-blur-md opacity-0 transition-opacity duration-300 pointer-events-none"
        onclick="closeLightbox(event)">
        <button
            class="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800/50 hover:bg-slate-700/80 p-2 rounded-full backdrop-blur-md transition-all z-10"
            onclick="closeLightbox(event)" title="Close (Escape)">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
        </button>
        <div
            class="relative w-full max-w-7xl h-full max-h-screen p-4 md:p-12 flex flex-col items-center justify-center pointer-events-none">
            <img id="lightbox-img" src="" alt=""
                class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.5)] pointer-events-auto cursor-default transform scale-95 transition-transform duration-300">
            <div class="mt-6 flex flex-col items-center pointer-events-auto">
                <p id="lightbox-caption" class="text-slate-200 text-lg font-medium tracking-wide"></p>
                <div id="lightbox-meta" class="flex gap-4 mt-2 text-sm text-slate-500"></div>
            </div>
        </div>
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxMeta = document.getElementById('lightbox-meta');

        function openLightbox(src, caption, size, date, format) {
            lightboxImg.src = src;
            lightboxCaption.textContent = caption;

            // Build metadata badges
            lightboxMeta.innerHTML = `
                <span class="flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>${size}</span>
                <span class="flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>${date}</span>
                <span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px] font-bold uppercase tracking-widest border border-indigo-500/30 ml-2">${format}</span>
            `;

            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            lightbox.classList.remove('pointer-events-none');

            // Trigger reflow for animation
            void lightbox.offsetWidth;

            lightbox.classList.remove('opacity-0');
            lightbox.classList.add('opacity-100');
            lightboxImg.classList.remove('scale-95');
            lightboxImg.classList.add('scale-100');

            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(e) {
            // Prevent bubbling if clicking on the image itself
            if (e && e.target === lightboxImg) return;

            lightbox.classList.remove('opacity-100');
            lightbox.classList.add('opacity-0');
            lightboxImg.classList.remove('scale-100');
            lightboxImg.classList.add('scale-95');
            lightbox.classList.add('pointer-events-none');

            setTimeout(() => {
                lightbox.classList.remove('flex');
                lightbox.classList.add('hidden');
                lightboxImg.src = '';
                document.body.style.overflow = '';
            }, 300);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
                closeLightbox();
            }
        });
    </script>
</body>

</html>
{{end}}
