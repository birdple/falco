server:
  port: 8080
  host: "0.0.0.0"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  shutdown_timeout: "30s"

storage:
  # Mode: "single" (default) or "multi" (named backends via storage.backends)
  mode: "single"
  primary: "filesystem"
  secondary: "none"
  # Replication mode when secondary != "none": "sync", "async", or "read-fallback"
  replication: "sync"
  local:
    path: "./data/images"
    create_dirs: true
  s3:
    bucket: "your-image-bucket"
    region: "us-west-2"
    endpoint: ""
    access_key: ""
    secret_key: ""
  minio:
    bucket: "your-minio-bucket"
    endpoint: "http://localhost:9000"
    region: "us-east-1"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    secure: false
  r2:
    bucket: ""
    account_id: ""
    access_key: ""
    secret_key: ""

  # Multi mode: named backends (uncomment to use)
  # default: "images"
  # backends:
  #   images:
  #     type: minio
  #     bucket: prod-images
  #     endpoint: "minio:9000"
  #     access_key: ""
  #     secret_key: ""
  #   backups:
  #     type: s3
  #     bucket: backup-bucket
  #     region: us-east-1
  #     access_key: ""
  #     secret_key: ""
  #   cdn:
  #     type: r2
  #     bucket: cdn-assets
  #     account_id: "your-cf-account-id"
  #     access_key: ""
  #     secret_key: ""

cache:
  size_mb: 256
  ttl_hours: 24
  cleanup_interval: "10m"

processing:
  max_file_size_mb: 10
  default_quality: 85
  default_format: "webp"
  concurrent_workers: 4
  supported_formats: ["jpeg", "png", "webp"]
  max_dimensions:
    width: 4000
    height: 4000

security:
  api_key_required: false
  api_key: ""           # Admin key: full access to all storages and buckets
  cors:
    origins: ["http://localhost:3000", "http://localhost:8080"]
    methods: ["GET", "POST", "OPTIONS"]
    headers: ["Content-Type", "Authorization"]
  rate_limit:
    requests_per_minute: 1000
    burst: 100

  honeypot:
    db_path: "data/honeypot.db"
    ban_threshold: 3

  # Scoped API keys: restrict access to specific storages/buckets per client
  # scoped_keys:
  #   - name: "client-a"
  #     key: "sk-client-a-secret-key"
  #     storages: ["images"]          # only access the "images" storage backend
  #     buckets: ["client-a-bucket"]  # only access this bucket
  #   - name: "client-b"
  #     key: "sk-client-b-secret-key"
  #     buckets: ["client-b-uploads", "client-b-assets"]

logging:
  level: "info"
  format: "text"
  output: "stdout"
  enable_caller: false

development:
  debug: true
  enable_pprof: false
  enable_metrics: false
