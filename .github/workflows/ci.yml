name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama invalida el anterior: acá cada job compila
# libvips-dev y CGO, y dejar corriendo revisiones muertas no sirve de nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# falco enlaza libvips por CGO y usa github.com/cshum/vipsgen/vips, que exige
# libvips 8.18.x. Ubuntu 24.04 (el ubuntu-latest del runner) trae 8.15 y Debian
# trixie 8.16: ninguna compila. Por eso TODO job que toque Go corre dentro de
# ubuntu:26.04, la primera LTS con 8.18 en apt.
env:
  GO_VERSION: "1.27.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      # Va antes del checkout a propósito: la imagen base no trae ni git ni las
      # herramientas de compilación.
      - name: System dependencies
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libvips-dev git ca-certificates curl

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: libvips version
        run: pkg-config --modversion vips

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System dependencies
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libvips-dev git ca-certificates curl

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "sin formatear:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # Compila y ARRANCA el binario en las dos libc que publica el release. Un
  # binario CGO puede compilar y no enlazar en runtime, así que el gate es que
  # /health conteste, no que `go build` termine.
  binary:
    name: Binary (${{ matrix.libc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@v5

      - name: Build and smoke test
        run: scripts/build-in-container.sh "${{ matrix.libc }}" 0.0.0-ci "${GITHUB_SHA::7}" dist

  # El Dockerfile es lo que se despliega en birdple-v2; si se rompe, se rompe en
  # el deploy y no en la revisión. Acá se construye y se arranca, sin publicar.
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: falco:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: scripts/smoke-image.sh falco:ci 0.0.0-ci
