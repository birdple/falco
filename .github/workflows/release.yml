name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  IMAGE: ghcr.io/birdple/falco

# Third-party actions are pinned by commit SHA (the tag is in the comment).
jobs:
  # ---------------------------------------------------------------------------
  # The whole CI pipeline — tests, lint, vulnerability scan, smoke tests — runs
  # on the tagged commit first. A tag pushed on a red commit publishes nothing.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # The image goes first and is published only after it has been started. The
  # GitHub release is what announces it, so it is created last: a release whose
  # `docker pull` points at nothing is a broken promise.
  # ---------------------------------------------------------------------------
  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [ci]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The tag carries a leading "v"; internal/version does not. Passing the
      # raw ref would make the image report "v0.13.0" and the binaries of the
      # same release "0.13.0".
      - name: Build metadata
        id: vars
        run: |
          {
            echo "commit=${GITHUB_SHA::7}"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      # Built first for the runner's architecture only and started; only then
      # comes the multi-arch build that is published.
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: falco:smoke
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
          # The release's own cache scope: pull requests write to scope=ci and
          # must never seed layers of a published image.
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Smoke test the image
        run: scripts/smoke-image.sh falco:smoke "${{ steps.vars.outputs.version }}"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
          # The release's own cache scope: pull requests write to scope=ci and
          # must never seed layers of a published image.
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          # Attestations add unknown/unknown entries to ghcr's tag listing.
          provenance: false

  # ---------------------------------------------------------------------------
  # Five binaries, each built and started on its own platform. No
  # cross-compiling: falco links libvips through CGO, and a cross-compiled
  # binary is exactly the one that builds and does not start.
  #
  # Linux is covered twice, once per libc, on purpose: the glibc binary does not
  # run on Alpine and the musl one does not run on Debian.
  # ---------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: [ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64 (glibc)
            runner: ubuntu-latest
            libc: glibc
          - name: linux/arm64 (glibc)
            runner: ubuntu-24.04-arm
            libc: glibc
          - name: linux/amd64 (musl)
            runner: ubuntu-latest
            libc: musl
          - name: linux/arm64 (musl)
            runner: ubuntu-24.04-arm
            libc: musl
          - name: darwin/arm64
            runner: macos-latest
            libc: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build metadata
        id: vars
        run: |
          {
            echo "commit=${GITHUB_SHA::7}"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      # macOS builds natively against Homebrew's libvips; Linux builds inside
      # the container that brings its libc with libvips 8.18.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.libc == 'native'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install libvips
        if: matrix.libc == 'native'
        run: brew install vips

      - name: Build and smoke test (macOS)
        if: matrix.libc == 'native'
        run: scripts/release-binary.sh "${{ steps.vars.outputs.version }}" "${{ steps.vars.outputs.commit }}" dist

      - name: Build and smoke test (Linux)
        if: matrix.libc != 'native'
        run: scripts/build-in-container.sh "${{ matrix.libc }}" "${{ steps.vars.outputs.version }}" "${{ steps.vars.outputs.commit }}" dist

      # Artifact names must be unique across the matrix jobs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.runner }}-${{ matrix.libc }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [image, binaries]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without the full history there is no previous tag and the changelog
          # comes out empty.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          set -eux
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md

      # `--verify-tag` refuses to publish a release for a tag missing from the
      # remote. Whether it is a prerelease is decided by the tag itself
      # (v1.0.0-rc.1).
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            $prerelease \
            artifacts/*.tar.gz artifacts/checksums.txt
