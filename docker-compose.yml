version: '3.8'

services:
  imagine-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ENV=development
      - STORAGE_PRIMARY=filesystem
      - STORAGE_LOCAL_PATH=/app/data/images
      - CACHE_SIZE_MB=256
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      - API_KEY_REQUIRED=false
      - CORS_ORIGINS=*
      - RATE_LIMIT_RPM=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - imagine-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - imagine-network
    profiles:
      - with-redis

  # PostgreSQL for metadata (optional)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=imagine
      - POSTGRES_USER=imagine
      - POSTGRES_PASSWORD=imagine_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - imagine-network
    profiles:
      - with-db

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - imagine-service
    restart: unless-stopped
    networks:
      - imagine-network
    profiles:
      - with-nginx

volumes:
  redis_data:
  postgres_data:
  nginx_logs:

networks:
  imagine-network:
    driver: bridge