# Local development stack. Every published port is bound to 127.0.0.1: none of
# this is meant to be reachable from the network.
#
#   docker compose --profile app up -d --build          # falco alone
#   docker compose --profile app --profile monitoring up -d --build
#
# falco runs with authentication ON, using development keys, so the stack
# behaves like production: uploads and /sign need the API key, delivery needs a
# signed URL (sign one with POST /api/v1/sign, or use the panel at
# http://localhost:8080, which signs for you). Override the keys through the
# environment or a .env file next to this one.

services:
  falco-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      # A bucket is mandatory: without STORAGE_DEFAULT and its bucket, startup
      # validation fails.
      - STORAGE_DEFAULT=local
      - STORAGE_BUCKET_LOCAL_TYPE=filesystem
      - STORAGE_BUCKET_LOCAL_PATH=/app/data/images
      - CACHE_SIZE_MB=256
      # Start the with-cache profile and set FALCO_ENABLE_REDIS=true to cache
      # in Valkey instead of in process.
      - ENABLE_REDIS=${FALCO_ENABLE_REDIS:-false}
      - REDIS_URL=redis://valkey:6379/0
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      # Development keys — never reuse them anywhere else.
      - API_KEY_REQUIRED=true
      - API_KEY=${FALCO_API_KEY:-falco-dev-api-key-not-for-production}
      - HMAC_REQUIRED=true
      - HMAC_KEY=${FALCO_HMAC_KEY:-6465762d686d61632d6b65792d6e6f742d666f722d70726f64756374696f6e21}
      - HMAC_SALT=${FALCO_HMAC_SALT:-6465762d686d61632d73616c742d6e6f742d666f722d70726f64756374696f6e}
      - HMAC_REQUIRE_EXPIRY=false
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
      - RATE_LIMIT_RPM=1000
      # Behind the API key; Prometheus (monitoring profile) scrapes with it.
      - ENABLE_METRICS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - falco-network
    profiles:
      - app

  # Valkey for caching (Redis-compatible, fully open source)
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    restart: unless-stopped
    networks:
      - falco-network
    profiles:
      - with-cache

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - falco-service
    restart: unless-stopped
    networks:
      - falco-network
    profiles:
      - with-nginx

  # Prometheus - metrics collection. It scrapes falco's /metrics with the same
  # development API key (deployments/monitoring/prometheus/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployments/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - falco-network
    profiles:
      - monitoring

  # Grafana - metrics visualization
  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-falco-dev}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - ./deployments/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - falco-network
    profiles:
      - monitoring

volumes:
  valkey_data:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  falco-network:
    driver: bridge
