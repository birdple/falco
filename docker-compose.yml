services:
  imagine-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ENV=development
      - STORAGE_PRIMARY=filesystem
      - STORAGE_LOCAL_PATH=/app/data/images
      - CACHE_SIZE_MB=256
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      - API_KEY_REQUIRED=false
      - CORS_ORIGINS=*
      - RATE_LIMIT_RPM=1000
      - ENABLE_METRICS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - imagine-network
    profiles:
      - app

  # Valkey for caching (Redis-compatible, fully open source)
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    restart: unless-stopped
    networks:
      - imagine-network
    profiles:
      - with-cache

  # PostgreSQL for metadata (optional)
  postgres:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=imagine
      - POSTGRES_USER=imagine
      - POSTGRES_PASSWORD=imagine_password
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - imagine-network
    profiles:
      - with-db

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - imagine-service
    restart: unless-stopped
    networks:
      - imagine-network
    profiles:
      - with-nginx

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - imagine-network
    profiles:
      - monitoring

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=imagine123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./deployments/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - imagine-network
    profiles:
      - monitoring

volumes:
  valkey_data:
  postgres_data:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  imagine-network:
    driver: bridge