server:
  port: 8080
  host: "0.0.0.0"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  shutdown_timeout: "30s"

storage:
  default: "local"

  buckets:
    local:
      type: filesystem
      path: "./data/images"

    # Example: S3 bucket with sync backup to MinIO and async to R2
    # images:
    #   type: s3
    #   bucket: prod-images
    #   region: us-west-2
    #   access_key: ""
    #   secret_key: ""
    #   backups:
    #     - target: "images-backup"
    #       mode: sync
    #     - target: "images-archive"
    #       mode: async
    #   keys:
    #     - name: "client-a"
    #       key: "sk-client-a-secret"
    #     - name: "client-b"
    #       key: "sk-client-b-secret"
    #
    # images-backup:
    #   type: minio
    #   bucket: backup-images
    #   endpoint: "http://minio:9000"
    #   access_key: ""
    #   secret_key: ""
    #
    # images-archive:
    #   type: r2
    #   bucket: archive-images
    #   account_id: ""
    #   access_key: ""
    #   secret_key: ""

  # Groups: organize buckets with shared keys and subgroups (1 level deep)
  # groups:
  #   media:
  #     buckets: ["images", "images-backup", "images-archive"]
  #     keys:
  #       - name: "media-team"
  #         key: "sk-media-team-secret"
  #     subgroups:
  #       thumbnails:
  #         buckets: ["images"]
  #         keys:
  #           - name: "thumb-service"
  #             key: "sk-thumb-service"

cache:
  size_mb: 256
  ttl_hours: 24
  cleanup_interval: "10m"

processing:
  max_file_size_mb: 10
  default_quality: 85
  default_format: "webp"
  concurrent_workers: 4
  supported_formats: ["jpeg", "png", "webp"]
  max_dimensions:
    width: 4000
    height: 4000

security:
  api_key_required: false
  api_key: ""
  cors:
    origins: ["http://localhost:3000", "http://localhost:8080"]
    methods: ["GET", "POST", "OPTIONS"]
    headers: ["Content-Type", "Authorization"]
  rate_limit:
    requests_per_minute: 1000
    burst: 100

logging:
  level: "info"
  format: "text"
  output: "stdout"
  enable_caller: false

development:
  debug: true
  enable_pprof: false
  enable_metrics: false
